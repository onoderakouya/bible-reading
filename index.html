<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>聖書読み上げ</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>聖書読み上げ</h1>
    </header>

    <main class="container">
      <section class="panel">
        <h2>本文選択</h2>
        <div class="field-grid">
          <label class="field">
            <span>書（book）</span>
            <select id="bookSelect"></select>
          </label>
          <label class="field">
            <span>章（chapter）</span>
            <select id="chapterSelect"></select>
          </label>
        </div>
      </section>

      <section class="panel">
        <h2>音声設定</h2>
        <div class="field-grid voice-grid">
          <div class="field">
            <span>男声 / 女声（推奨プリセット）</span>
            <div class="segmented">
              <label>
                <input type="radio" name="voicePreset" value="male" checked />
                男声
              </label>
              <label>
                <input type="radio" name="voicePreset" value="female" />
                女声
              </label>
            </div>
          </div>
          <label class="field">
            <span>利用音声</span>
            <select id="voiceSelect"></select>
          </label>
          <label class="field">
            <span>読み上げ速度: <strong id="rateValue">1.0</strong></span>
            <input id="rateRange" type="range" min="0.8" max="1.3" step="0.1" value="1.0" />
          </label>
          <label class="field">
            <span>ピッチ: <strong id="pitchValue">1.0</strong></span>
            <input id="pitchRange" type="range" min="0.8" max="1.2" step="0.1" value="1.0" />
          </label>
        </div>
      </section>

      <section class="panel">
        <div class="toggle-row">
          <h2>連続再生</h2>
          <label class="switch" for="continuousToggle">
            <input type="checkbox" id="continuousToggle" />
            <span class="slider"></span>
          </label>
        </div>
        <p class="hint">ONの場合、章を読み終えたら自動で次章へ進みます。</p>
      </section>

      <section class="panel">
        <h2>再生コントロール</h2>
        <div class="control-buttons">
          <button id="playBtn">再生</button>
          <button id="pauseBtn">一時停止</button>
          <button id="resumeBtn">再開</button>
          <button id="stopBtn">停止</button>
        </div>
        <div class="status-grid">
          <p>状態: <strong id="statusText">停止中</strong></p>
          <p>現在: <strong id="currentRef">-</strong></p>
          <p>進捗: <strong id="progressText">0 / 0</strong></p>
        </div>
        <p id="errorText" class="error"></p>
      </section>

      <section class="panel">
        <h2>本文</h2>
        <div id="paragraphList" class="paragraph-list"></div>
      </section>

      <section class="panel usage">
        <h2>使い方</h2>
        <ol>
          <li>書と章を選択して「再生」を押すと、本文を段落ごとに読み上げます。</li>
          <li>男声/女声は推奨プリセットです。必要に応じて「利用音声」から手動で変更できます。</li>
          <li>「連続再生」をONにすると、章末で次章へ自動遷移して読み上げを継続します。</li>
          <li>停止ボタンはキューをクリアして読み上げを完全停止します。</li>
        </ol>
      </section>
    </main>

    <script src="app.js" defer></script>
  </body>
</html>
